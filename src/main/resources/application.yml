spring:
  application:
    name: InSpectrum

  datasource:
    url: jdbc:postgresql://localhost:5432/neuro_app
    username: neuro
    password: neuro_password
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml


  jackson:
   property-naming-strategy: SNAKE_CASE

jwt:
  secret: ${JWT_SECRET:a-string-secret-at-least-256-bits-long}
  ttl-millis: ${JWT_TTL:604800000} # 1 week in millisecond