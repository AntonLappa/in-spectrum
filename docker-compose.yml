services:
  db:
    image: postgres:16
    container_name: neuro_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: neuro
      POSTGRES_PASSWORD: neuro_password
      POSTGRES_DB: neuro_app
    volumes:
      - neuro_pgdata:/var/lib/postgresql/data

volumes:
  neuro_pgdata: